[build]
  publish = "."
  functions = "netlify/functions"

# Front-end calls /api/chat; Netlify routes it to the serverless function.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Front-end calls /api/db for storing customers, chats, kit lists and checklists.
[[redirects]]
  from = "/api/db"
  to = "/.netlify/functions/db"
  status = 200
